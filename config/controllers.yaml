controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_controller:
      type: position_controllers/JointGroupPositionController

# Order here = order of the 12 numbers the gait node publishes on /leg_controller/commands
leg_controller:
  ros__parameters:
    joints:
      - FL_hip_yaw
      - FL_hip_pitch
      - FL_knee
      - FR_hip_yaw
      - FR_hip_pitch
      - FR_knee
      - RL_hip_yaw
      - RL_hip_pitch
      - RL_knee
      - RR_hip_yaw
      - RR_hip_pitch
      - RR_knee
